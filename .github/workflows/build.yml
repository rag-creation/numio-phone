name: Build

# Test builds only. Real releases are built and signed on RR's own computer,
# so the Numio signing key never goes to GitHub.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Same throwaway debug key between builds, so a new test build
      # installs over the last one on the phone.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: phone-debug-key

      # Debug APK to test, unit tests, and the real release build (R8 on),
      # so a release-only problem shows up here first.
      - name: Build and test
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest assembleRelease 2>&1 | tee build.log

      # Privacy check on what actually ships: the release APK must not ask for internet access.
      - name: Check release APK permissions
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Permissions in $APK:"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::Release APK declares INTERNET permission"
            exit 1
          fi

      # Full list of libraries in the release app, to review what we ship
      - name: List release dependencies
        run: ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > release-dependencies.txt

      # On failure, turn the first error lines into annotations on the run page
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|^ +> |error:|Could not|FAILED" build.log | grep -v "> Task" | head -30 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneDebug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneDebug.apk
          path: PhoneDebug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            permissions.txt
            release-dependencies.txt
            app/build/reports/tests/
